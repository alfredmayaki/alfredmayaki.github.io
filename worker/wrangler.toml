name = "shy-sea-600a"
main = "src/index.js"
compatibility_date = "2026-01-09"
workers_dev = true
# Add one ai_models entry that maps binding "AI" to the Deepgram model used in the worker
binding = "AI"
model = "@cf/deepgram/aura-2-en"
# If you use a gateway or custom configuration require additional fields in your Cloudflare dashboard.

routes = [
  { pattern = "alfredmayaki.me/chat*", zone_name = "alfredmayaki.me" },
  { pattern = "www.alfredmayaki.me/chat*", zone_name = "alfredmayaki.me" }
]

[vars]
AI_MODEL = "claude-opus-4-5-20251101"
AI_PROVIDER = "anthropic"