name = "search-tracker"
main = "search-tracker.js"
compatibility_date = "2024-01-15"

# KV Namespace for storing search data
kv_namespaces = [
  { binding = "SEARCH_DATA", id = "721c412d71b449e2ab97569edacb7fd7" }
]

# Routes - using workers.dev for testing (change to custom domain later)
# routes = [
#   { pattern = "alfredmayaki.me/api/search/*", zone_name = "alfredmayaki.me" }
# ]

# Use workers.dev subdomain for testing
workers_dev = true

[build]
command = ""

# ========================================
# 🔐 SECRETS - DO NOT COMMIT ACTUAL VALUES!
# ========================================
# Set this using: wrangler secret put API_SECRET
# Then enter a strong random key when prompted
# 
# To set the secret:
#   wrangler secret put API_SECRET
#   Enter a secret value: [paste your secret key]
# 
# The secret will be stored securely in Cloudflare
# and accessible via env.API_SECRET in your worker
# 
# To generate a strong key:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

# Optional: Separate environments (uncomment and configure if needed)
# [env.production]
# kv_namespaces = [
#   { binding = "SEARCH_DATA", id = "721c412d71b449e2ab97569edacb7fd7" }
# ]
#
# [env.staging]
# kv_namespaces = [
#   { binding = "SEARCH_DATA", id = "YOUR_STAGING_KV_ID721c412d71b449e2ab97569edacb7fd7" }
# ]
