<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Tag Cloud — Alfred Mayaki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visualization of Claude AI search queries">

  <!-- Prevent caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --font-sans: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      --bg-overlay: rgba(22, 22, 22, 0.92);
      --panel: #161616;
      --surface: #2a2a2a;
      --text: #ffffff;
      --text-muted: #979797;
      --border: #464242;
      --brand: #3d4ee9;
      --brand-hover: #5563f0;
      --accent-1: #10b981;
      --accent-2: #f59e0b;
      --accent-3: #ef4444;
      --accent-4: #8b5cf6;
      --radius-lg: 16px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 5px;
      font-family: var(--font-sans);
      color: var(--text-muted);
      background: url("/universe.png") center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      min-height: 100vh;
      padding: 3em;
      background: var(--bg-overlay);
      border: 3px solid var(--border);
      animation: fadeIn 0.7s ease-in;
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Back to Home Button */
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      margin-bottom: 2em;
      min-height: 36px;
      background: #3d4ee9;
      color: #ffffff !important;
      border: 2px solid #3d4ee9;
      border-radius: 999px;
      font-size: 0.85em;
      font-weight: 600;
      text-decoration: none !important;
      white-space: nowrap;
      transition: all 0.2s ease;
      cursor: pointer;
      align-self: flex-start;
    }

    .back-home-btn:hover {
      background: #5563f0;
      box-shadow: 0 4px 12px rgba(61, 78, 233, 0.4);
      transform: translateY(-2px);
    }

    .view-toggle {
      display: flex;
      gap: 0.5em;
      justify-content: center;
      margin-top: 1.5em;
      padding: 0.5em;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      display: inline-flex;
    }

    .toggle-btn {
      padding: 0.6em 1.5em;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: var(--radius-pill);
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .toggle-btn.active {
      background: var(--brand);
      color: var(--text);
    }

    header {
      text-align: center;
      margin-bottom: 3em;
    }

    h1 {
      margin: 0 0 0.5em 0;
      font-size: 2.5em;
      color: var(--text);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1em;
      margin-bottom: 2em;
    }

    .stats-bar {
      display: flex;
      gap: 2em;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2em;
      padding: 1.5em;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: var(--brand);
    }

    .stat-label {
      font-size: 0.9em;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 1em;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2em;
    }

    .btn {
      padding: 0.7em 1.5em;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--brand);
      border-color: var(--brand);
      transform: translateY(-2px);
    }

    .btn.danger {
      background: var(--accent-3);
      border-color: var(--accent-3);
    }

    .btn.danger:hover {
      background: #dc2626;
      border-color: #dc2626;
    }

    .tag-cloud-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3em 2em;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      min-height: 500px;
      position: relative;
      overflow: hidden;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1em;
      max-width: 100%;
    }

    .tag {
      display: inline-block;
      padding: 0.4em 1em;
      background: linear-gradient(135deg, var(--brand), var(--brand-hover));
      color: var(--text);
      border-radius: var(--radius-pill);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: tagAppear 0.5s ease-out;
      position: relative;
    }

    @keyframes tagAppear {
      from {
        opacity: 0;
        transform: scale(0.5) rotate(-10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .tag:hover {
      transform: scale(1.1) rotate(2deg);
      box-shadow: 0 8px 20px rgba(61, 78, 233, 0.4);
      z-index: 10;
    }

    .tag::after {
      content: attr(data-count);
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--accent-1);
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7em;
      font-weight: bold;
    }

    /* Size variations based on frequency */
    .tag.size-1 { font-size: 0.8em; opacity: 0.7; }
    .tag.size-2 { font-size: 0.9em; opacity: 0.75; }
    .tag.size-3 { font-size: 1em; opacity: 0.8; }
    .tag.size-4 { font-size: 1.2em; opacity: 0.85; }
    .tag.size-5 { font-size: 1.4em; opacity: 0.9; }
    .tag.size-6 { font-size: 1.6em; opacity: 0.95; }
    .tag.size-7 { font-size: 1.8em; opacity: 1; }
    .tag.size-8 { font-size: 2em; opacity: 1; }
    .tag.size-9 { font-size: 2.3em; opacity: 1; }
    .tag.size-10 { font-size: 2.6em; opacity: 1; font-weight: 700; }

    /* Color variations */
    .tag:nth-child(5n+1) { background: linear-gradient(135deg, var(--brand), var(--brand-hover)); }
    .tag:nth-child(5n+2) { background: linear-gradient(135deg, var(--accent-1), #059669); }
    .tag:nth-child(5n+3) { background: linear-gradient(135deg, var(--accent-2), #d97706); }
    .tag:nth-child(5n+4) { background: linear-gradient(135deg, var(--accent-4), #7c3aed); }
    .tag:nth-child(5n+5) { background: linear-gradient(135deg, #ec4899, #db2777); }

    .empty-state {
      text-align: center;
      padding: 4em 2em;
    }

    .empty-state i {
      font-size: 4em;
      color: var(--text-muted);
      margin-bottom: 0.5em;
    }

    .empty-state h2 {
      color: var(--text);
      margin-bottom: 0.5em;
    }

    .empty-state p {
      color: var(--text-muted);
      margin-bottom: 2em;
    }

    .recent-searches {
      margin-top: 3em;
      padding: 2em;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .recent-searches h3 {
      color: var(--text);
      margin-bottom: 1em;
    }

    .search-item {
      padding: 0.8em 1em;
      margin-bottom: 0.5em;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-query {
      color: var(--text);
      flex: 1;
    }

    .search-time {
      color: var(--text-muted);
      font-size: 0.85em;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .container {
        padding: 1.5em;
      }

      h1 {
        font-size: 1.8em;
      }

      .stats-bar {
        flex-direction: column;
        gap: 1em;
      }

      .tag-cloud-container {
        padding: 2em 1em;
        min-height: 400px;
      }

      .tag {
        font-size: 0.9em !important;
      }

      .back-home-btn {
        padding: 7px 14px;
        font-size: 0.8em;
      }
    }

    @media (max-width: 480px) {
      .back-home-btn {
        padding: 6px 12px;
        font-size: 0.75em;
      }
    }
  </style>
</head>
<body>
  <div id="particles-js" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;"></div>

  <div class="container">
    <!-- Back Button -->
    <a href="index.html" class="back-home-btn">
      <i class="fas fa-arrow-left"></i>
      Back to Home
    </a>

    <header>
      <h1>📊 Search Tag Cloud</h1>
      <p class="subtitle">Visualizing Claude AI search queries</p>

      <!-- View Toggle -->
      <div class="view-toggle">
        <button class="toggle-btn active" id="personalBtn" onclick="showPersonalCloud()">
          🔒 My Searches
        </button>
        <button class="toggle-btn" id="globalBtn" onclick="showGlobalCloud()">
          🌍 Everyone's Searches
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="totalSearches">0</div>
        <div class="stat-label">Total Searches</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="uniqueWords">0</div>
        <div class="stat-label">Unique Keywords</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="topWord">—</div>
        <div class="stat-label">Most Searched</div>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 1em; color: var(--text-muted); font-size: 0.85em;">
      <i class="fas fa-clock"></i> Last updated: <span id="lastUpdated">Never</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" onclick="refreshCloud(event)">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
      <button class="btn" onclick="exportData()">
        <i class="fas fa-download"></i> Export Data
      </button>
      <button class="btn danger" onclick="clearData()">
        <i class="fas fa-trash"></i> Clear All Data
      </button>
    </div>

    <!-- Tag Cloud -->
    <div class="tag-cloud-container">
      <div id="tagCloud" class="tag-cloud"></div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-search"></i>
        <h2>No Searches Yet</h2>
        <p>Start searching on the homepage to see your tag cloud!</p>
        <a href="index.html" class="btn">Go to Homepage</a>
      </div>
    </div>

    <!-- Recent Searches -->
    <div class="recent-searches" id="recentSearches" style="display: none;">
      <h3>🕐 Recent Searches</h3>
      <div id="recentList"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>

  <!-- Firebase SDK (for site-wide tracking) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // Initialize particles
    if (typeof particlesJS !== 'undefined') {
      particlesJS('particles-js', {
        particles: {
          number: { value: 60, density: { enable: true, value_area: 800 } },
          color: { value: '#3d4ee9' },
          shape: { type: 'circle' },
          opacity: { value: 0.4, random: false },
          size: { value: 3, random: true },
          line_linked: {
            enable: true,
            distance: 150,
            color: '#3d4ee9',
            opacity: 0.3,
            width: 1
          },
          move: { enable: true, speed: 1.5 }
        },
        interactivity: {
          detect_on: 'canvas',
          events: { 
            onhover: { enable: true, mode: 'repulse' }, 
            onclick: { enable: true, mode: 'push' }
          }
        },
        retina_detect: true
      });
    }

    // Initialize Firebase (optional, for backward compatibility)
    let firebaseInitialized = false;
    let isGlobalView = false;

    if (window.FirebaseSearchTracking) {
      firebaseInitialized = window.FirebaseSearchTracking.initFirebase();
      if (firebaseInitialized) {
        console.log('✅ Firebase initialized (legacy support)');
      } else {
        console.log('ℹ️ Firebase not configured - using Cloudflare Worker API only');
      }
    }

    async function showGlobalCloud() {
      console.log('🌍 Loading global cloud from Cloudflare Worker API...');

      isGlobalView = true;
      document.getElementById('personalBtn').classList.remove('active');
      document.getElementById('globalBtn').classList.add('active');

      // Show loading
      const tagCloudEl = document.getElementById('tagCloud');
      const emptyStateEl = document.getElementById('emptyState');
      tagCloudEl.innerHTML = '<div style="text-align: center; padding: 3em; color: var(--text-muted)"><i class="fas fa-spinner fa-spin" style="font-size: 3em; margin-bottom: 1em;"></i><br>Loading global data from Cloudflare...</div>';

      try {
        // Use Cloudflare Worker API instead of Firebase
        console.log('🔄 Calling SearchTrackerAPI.getGlobalCloud()...');
        const result = await SearchTrackerAPI.getGlobalCloud(50);

        console.log('📦 Global API Result:', result);
        console.log('  - Success:', result.success);
        console.log('  - Source:', result.source);

        if (!result.success) {
          throw new Error(result.error || 'Failed to load global data');
        }

        const data = result.data;

        if (!data.keywords || Object.keys(data.keywords).length === 0) {
          console.log('⚠️ No global data available yet');
          emptyStateEl.style.display = 'block';
          tagCloudEl.innerHTML = '';
          document.getElementById('totalSearches').textContent = '0';
          document.getElementById('uniqueWords').textContent = '0';
          document.getElementById('topWord').textContent = '—';
          document.getElementById('recentSearches').style.display = 'none';
          return;
        }

        emptyStateEl.style.display = 'none';

        console.log('✅ Global data loaded:', data.totalSearches, 'total searches');

        // Render global tag cloud (keywords, totalSearches, recentSearches)
        renderTagCloud(data.keywords, data.totalSearches, data.recentSearches);

        // Update last updated timestamp
        document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

      } catch (error) {
        console.error('❌ Error loading global data:', error);

        // Show error state
        tagCloudEl.innerHTML = `
          <div style="text-align: center; padding: 3em; color: var(--text-muted)">
            <i class="fas fa-exclamation-triangle" style="font-size: 3em; margin-bottom: 1em; color: var(--accent-3);"></i>
            <h3 style="color: var(--text); margin-bottom: 0.5em;">Unable to Load Global Data</h3>
            <p style="margin-bottom: 1em;">${error.message}</p>
            <p style="font-size: 0.9em;">
              ${error.message.includes('404') || error.message.includes('Failed to fetch') ? 
                '💡 The Cloudflare Worker needs to be deployed.<br>Run <code style="background: var(--surface); padding: 4px 8px; border-radius: 4px;">wrangler deploy</code> to enable global tracking.' : 
                'Check browser console for details.'}
            </p>
            <button class="btn" onclick="showPersonalCloud()" style="margin-top: 1em;">
              <i class="fas fa-arrow-left"></i> Back to My Searches
            </button>
          </div>
        `;
        document.getElementById('recentSearches').style.display = 'none';
      }
    }

    function showPersonalCloud() {
      isGlobalView = false;
      document.getElementById('globalBtn').classList.remove('active');
      document.getElementById('personalBtn').classList.add('active');

      // Load personal data (existing function)
      loadTagCloud();
    }

    function renderTagCloud(keywords, totalSearches, recentSearches = null) {
      const tagCloudEl = document.getElementById('tagCloud');
      const emptyStateEl = document.getElementById('emptyState');

      // Convert object to sorted array
      const keywordArray = Object.entries(keywords)
        .filter(([word]) => !word.startsWith('_query_'))
        .sort((a, b) => b[1] - a[1]);

      if (keywordArray.length === 0) {
        tagCloudEl.innerHTML = '';
        emptyStateEl.style.display = 'block';
        return;
      }

      emptyStateEl.style.display = 'none';

      // Calculate stats
      const uniqueWords = keywordArray.length;
      const topWord = keywordArray[0][0];

      document.getElementById('totalSearches').textContent = totalSearches || 0;
      document.getElementById('uniqueWords').textContent = uniqueWords;
      document.getElementById('topWord').textContent = topWord;

      // Calculate size classes
      const maxCount = keywordArray[0][1];
      const minCount = keywordArray[keywordArray.length - 1][1];
      const range = maxCount - minCount;

      function getSizeClass(count) {
        if (range === 0) return 'size-5';
        const normalized = (count - minCount) / range;
        const size = Math.ceil(normalized * 9) + 1;
        return `size-${size}`;
      }

      // Generate tags
      tagCloudEl.innerHTML = keywordArray
        .slice(0, 50)
        .map(([word, count]) => {
          const sizeClass = getSizeClass(count);
          return `<span class="tag ${sizeClass}" data-count="${count}" onclick="searchWord('${word}')">${word}</span>`;
        })
        .join('');

      // Show recent searches if available
      if (recentSearches && recentSearches.length > 0) {
        document.getElementById('recentSearches').style.display = 'block';
        const recentList = recentSearches
          .slice(0, 10)
          .map(search => {
            const date = new Date(search.timestamp);
            const timeStr = date.toLocaleString();
            return `
              <div class="search-item">
                <span class="search-query">${search.query}</span>
                <span class="search-time">${timeStr}</span>
              </div>
            `;
          })
          .join('');
        document.getElementById('recentList').innerHTML = recentList;
      } else {
        document.getElementById('recentSearches').style.display = 'none';
      }
    }

    async function loadTagCloud() {
      console.log('📊 Loading personal tag cloud at', new Date().toLocaleTimeString());

      // ALWAYS update timestamp first
      const now = new Date();
      document.getElementById('lastUpdated').textContent = now.toLocaleTimeString();
      console.log('⏰ Updated timestamp:', now.toLocaleTimeString());

      // Fetch from API (auto-fallback to localStorage)
      console.log('🔄 Calling SearchTrackerAPI.getUserCloud()...');
      const result = await SearchTrackerAPI.getUserCloud(50);

      console.log('📦 API Result:', result);
      console.log('  - Success:', result.success);
      console.log('  - Source:', result.source);
      console.log('  - Data:', result.data);

      if (!result.success) {
        console.error('❌ Failed to load cloud:', result.error);
        document.getElementById('tagCloud').innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      const { keywords, recentSearches, totalSearches, uniqueWords } = result.data;
      console.log('✅ Loaded from:', result.source);
      console.log('📊 Stats - Total:', totalSearches, 'Unique:', uniqueWords);
      console.log('📝 Recent searches array:', recentSearches);
      console.log('📝 Recent searches length:', recentSearches ? recentSearches.length : 0);

      const tagCloudEl = document.getElementById('tagCloud');
      const emptyStateEl = document.getElementById('emptyState');

      // Convert keywords object to sorted array
      const keywordArray = Object.entries(keywords)
        .sort((a, b) => b[1] - a[1]);

      if (keywordArray.length === 0) {
        tagCloudEl.innerHTML = '';
        emptyStateEl.style.display = 'block';
        return;
      }

      emptyStateEl.style.display = 'none';

      // Calculate stats
      const topWord = keywordArray[0][0];

      document.getElementById('totalSearches').textContent = totalSearches;
      document.getElementById('uniqueWords').textContent = uniqueWords;
      document.getElementById('topWord').textContent = topWord;

      // Calculate size classes (1-10)
      const maxCount = keywordArray[0][1];
      const minCount = keywordArray[keywordArray.length - 1][1];
      const range = maxCount - minCount;

      function getSizeClass(count) {
        if (range === 0) return 'size-5';
        const normalized = (count - minCount) / range;
        const size = Math.ceil(normalized * 9) + 1;
        return `size-${size}`;
      }

      // Generate tags
      tagCloudEl.innerHTML = keywordArray
        .slice(0, 50) // Limit to top 50
        .map(([word, count]) => {
          const sizeClass = getSizeClass(count);
          return `<span class="tag ${sizeClass}" data-count="${count}" onclick="searchWord('${word}')">${word}</span>`;
        })
        .join('');

        // Show recent searches with detailed logging
        console.log('📝 Starting recent searches rendering...');
        console.log('📝 recentSearches is:', typeof recentSearches, recentSearches);

        if (recentSearches && Array.isArray(recentSearches) && recentSearches.length > 0) {
          const recentSearchesEl = document.getElementById('recentSearches');
          const recentListEl = document.getElementById('recentList');

          console.log('📝 Recent searches element:', recentSearchesEl);
          console.log('📝 Recent list element:', recentListEl);

          if (!recentSearchesEl || !recentListEl) {
            console.error('❌ Recent searches DOM elements not found!');
            return;
          }

          recentSearchesEl.style.display = 'block';

          // Update the heading with count
          const headingEl = recentSearchesEl.querySelector('h3');
          if (headingEl) {
            headingEl.textContent = `🕐 Recent Searches (${Math.min(recentSearches.length, 10)})`;
          }

          const recentList = recentSearches
            .slice(0, 10)
            .map((search, index) => {
              console.log(`📝 Processing search ${index}:`, search);

              // Handle both formats: {query, timestamp} or just the search object
              const query = search.query || search;
              const timestamp = search.timestamp || Date.now();

              const date = new Date(timestamp);
              const timeStr = date.toLocaleString();

              // Calculate how long ago
              const now = Date.now();
              const diff = now - timestamp;
              const seconds = Math.floor(diff / 1000);
              const minutes = Math.floor(seconds / 60);
              const hours = Math.floor(minutes / 60);
              const days = Math.floor(hours / 24);

              let timeAgo;
              if (seconds < 60) {
                timeAgo = 'Just now';
              } else if (minutes < 60) {
                timeAgo = `${minutes} min${minutes !== 1 ? 's' : ''} ago`;
              } else if (hours < 24) {
                timeAgo = `${hours} hour${hours !== 1 ? 's' : ''} ago`;
              } else {
                timeAgo = `${days} day${days !== 1 ? 's' : ''} ago`;
              }

              console.log(`  - Query: ${query}, Time: ${timeStr}, Ago: ${timeAgo}`);

              // Add "new" badge for searches within last 30 seconds
              const isNew = seconds < 30;
              const newBadge = isNew ? '<span style="background: var(--accent-1); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75em; margin-left: 8px;">NEW</span>' : '';

              return `
                <div class="search-item" data-age="${seconds}">
                  <span class="search-query">${query}${newBadge}</span>
                  <span class="search-time" title="${timeStr}">${timeAgo}</span>
                </div>
              `;
            })
            .join('');

          console.log('📝 Recent searches HTML:', recentList.substring(0, 200) + '...');
          recentListEl.innerHTML = recentList;
          console.log('✅ Recent searches updated successfully');
        } else {
          console.log('⚠️ No recent searches to show');
          console.log('  - recentSearches:', recentSearches);
          console.log('  - Is array?', Array.isArray(recentSearches));
          console.log('  - Length:', recentSearches ? recentSearches.length : 'N/A');
          document.getElementById('recentSearches').style.display = 'none';
        }
      }

    function searchWord(word) {
      alert(`Searching for: "${word}"\n\nThis would typically trigger a new search on the homepage.`);
      // Optionally redirect to homepage with search
      // window.location.href = `index.html?search=${encodeURIComponent(word)}`;
    }

    function refreshCloud(event) {
      console.log('🔄 REFRESH BUTTON CLICKED at', new Date().toLocaleTimeString());
      console.log('🔄 Current view - isGlobalView:', isGlobalView);

      // Get the button reference first
      const btn = event?.target?.closest('button');

      if (isGlobalView) {
        console.log('🌍 Refreshing GLOBAL cloud...');
        showGlobalCloud();
      } else {
        console.log('🔒 Refreshing PERSONAL cloud...');
        console.log('🔒 About to call loadTagCloud()...');

        // Force a complete refresh
        const tagCloudEl = document.getElementById('tagCloud');
        tagCloudEl.innerHTML = '<div style="text-align: center; padding: 2em; color: var(--text-muted)"><i class="fas fa-spinner fa-spin"></i><br>Refreshing...</div>';

        // Small delay to show spinner
        setTimeout(() => {
          loadTagCloud();
          console.log('✅ loadTagCloud() completed');
        }, 100);
      }

      // Visual feedback on button
      if (btn) {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Refreshing...';
        btn.disabled = true;

        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.disabled = false;
          console.log('✅ Refresh complete');
        }, 600);
      }
    }

    function exportData() {
      let searches, timestamps;

      try {
        searches = JSON.parse(localStorage.getItem('claudeSearches') || '{}');
        timestamps = JSON.parse(localStorage.getItem('claudeSearchTimestamps') || '[]');
      } catch (error) {
        console.error('❌ Error reading data for export:', error);
        alert('Error reading search data. Cannot export.');
        return;
      }
      
      const data = {
        keywords: searches,
        searches: timestamps,
        exportDate: new Date().toISOString()
      };
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `claude-searches-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function clearData() {
      if (confirm('Are you sure you want to clear all search data? This cannot be undone.')) {
        console.log('🗑️ Clearing all data...');

        // Use API to clear both localStorage and server data
        const result = await SearchTrackerAPI.clearUserData();

        if (result.success) {
          console.log('✅ Data cleared:', result.localOnly ? 'localStorage only' : 'localStorage + API');
        } else {
          console.warn('⚠️ Clear failed, trying manual clear...');

          // Fallback: clear localStorage manually
          try {
            localStorage.removeItem('claudeSearches');
            localStorage.removeItem('claudeSearchTimestamps');
          } catch (error) {
            console.error('❌ Error clearing localStorage:', error);
            alert('Error clearing data. Please try clearing browser cache manually.');
            return;
          }
        }

        // Set a flag to indicate data was just cleared
        sessionStorage.setItem('dataJustCleared', 'true');

        // Immediate visual update
        document.getElementById('tagCloud').innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('totalSearches').textContent = '0';
        document.getElementById('uniqueWords').textContent = '0';
        document.getElementById('topWord').textContent = '—';
        document.getElementById('recentSearches').style.display = 'none';
        document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

        // Force hard reload with cache bypass
        setTimeout(() => {
          window.location.href = window.location.href.split('?')[0] + '?nocache=' + Date.now();
        }, 1000);
      }
    }

        // Load on page load
        window.addEventListener('DOMContentLoaded', function() {
          // Check if data was just cleared
          if (sessionStorage.getItem('dataJustCleared') === 'true') {
            console.log('🗑️ Data was just cleared - forcing empty state');
            sessionStorage.removeItem('dataJustCleared');

            // Force empty state
            document.getElementById('tagCloud').innerHTML = '';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('totalSearches').textContent = '0';
            document.getElementById('uniqueWords').textContent = '0';
            document.getElementById('topWord').textContent = '—';
            document.getElementById('recentSearches').style.display = 'none';
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

            // Reset counter
            lastKnownSearchCount = 0;
          } else {
            // Normal load
            loadTagCloud();

            // Initialize counter with current count
            try {
              const timestamps = JSON.parse(localStorage.getItem('claudeSearchTimestamps') || '[]');
              lastKnownSearchCount = timestamps.length;
              console.log('📊 Initialized search counter:', lastKnownSearchCount);
            } catch (error) {
              lastKnownSearchCount = 0;
            }
          }
        });

        // ========================================
        // AUTO-REFRESH ON STORAGE CHANGES
        // ========================================
        // Listen for localStorage changes from other tabs/windows (like index.html)
        window.addEventListener('storage', function(e) {
          // Only refresh if search data changed
          if (e.key === 'claudeSearches' || e.key === 'claudeSearchTimestamps') {
            console.log('🔔 Storage changed:', e.key);
            console.log('🔄 Auto-refreshing tag cloud...');

            // Show brief notification
            const lastUpdatedEl = document.getElementById('lastUpdated');
            lastUpdatedEl.textContent = 'Updating...';
            lastUpdatedEl.style.color = 'var(--brand)';

            // Immediate refresh - no delay
            if (!isGlobalView) {
              loadTagCloud().then(() => {
                // Flash the recent searches section to draw attention
                const recentSearchesEl = document.getElementById('recentSearches');
                if (recentSearchesEl && recentSearchesEl.style.display !== 'none') {
                  recentSearchesEl.style.animation = 'highlightNew 0.8s ease-out';
                  setTimeout(() => {
                    recentSearchesEl.style.animation = '';
                  }, 800);
                }
              });
            }

            // Reset color after update
            setTimeout(() => {
              lastUpdatedEl.style.color = '';
            }, 800);
          }
        });

        // ========================================
        // PERIODIC AUTO-REFRESH (SAME TAB)
        // ========================================
        // Auto-refresh every 3 seconds if data might have changed
        let lastKnownSearchCount = 0;

        // Initialize on page load
        try {
          const timestamps = JSON.parse(localStorage.getItem('claudeSearchTimestamps') || '[]');
          lastKnownSearchCount = timestamps.length;
          console.log('📊 Initial search count:', lastKnownSearchCount);
        } catch (error) {
          lastKnownSearchCount = 0;
        }

        setInterval(() => {
          if (isGlobalView) return; // Don't auto-refresh global view

          try {
            const timestamps = JSON.parse(localStorage.getItem('claudeSearchTimestamps') || '[]');
            const currentCount = timestamps.length;

            if (currentCount !== lastKnownSearchCount) {
              console.log('🔔 New searches detected:', currentCount, 'vs', lastKnownSearchCount);
              console.log('   → New searches:', currentCount - lastKnownSearchCount);
              console.log('🔄 Auto-refreshing...');

              lastKnownSearchCount = currentCount;

              loadTagCloud().then(() => {
                // Highlight the recent searches section
                const recentSearchesEl = document.getElementById('recentSearches');
                if (recentSearchesEl && recentSearchesEl.style.display !== 'none') {
                  // Add visual feedback
                  const recentList = document.getElementById('recentList');
                  if (recentList) {
                    const firstItem = recentList.querySelector('.search-item');
                    if (firstItem) {
                      firstItem.style.animation = 'slideInRight 0.5s ease-out';
                      firstItem.style.backgroundColor = 'rgba(61, 78, 233, 0.2)';
                      setTimeout(() => {
                        firstItem.style.animation = '';
                        firstItem.style.backgroundColor = '';
                      }, 2000);
                    }
                  }
                }
              });
            }
          } catch (error) {
            console.error('❌ Auto-refresh check failed:', error);
          }
        }, 3000); // Check every 3 seconds (faster for better UX)

        // ========================================
        // ADD ANIMATION STYLES
        // ========================================
        const style = document.createElement('style');
        style.textContent = `
          @keyframes highlightNew {
            0% { 
              box-shadow: 0 0 0 0 rgba(61, 78, 233, 0.7);
            }
            50% {
              box-shadow: 0 0 0 10px rgba(61, 78, 233, 0);
            }
            100% {
              box-shadow: 0 0 0 0 rgba(61, 78, 233, 0);
            }
          }

          @keyframes slideInRight {
            from {
              transform: translateX(100%);
              opacity: 0;
            }
            to {
              transform: translateX(0);
              opacity: 1;
            }
          }

          .search-item {
            transition: background-color 0.5s ease, transform 0.2s ease;
          }

          .search-item:hover {
            transform: translateX(5px);
            background: rgba(61, 78, 233, 0.1) !important;
          }
        `;
        document.head.appendChild(style);
          </script>

          <!-- Search Tracker API Client -->
          <script src="search-tracker-api.js"></script>
