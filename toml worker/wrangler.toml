name = "shy-sea-600a"
main = "src/index.js"
compatibility_date = "2026-01-09"
workers_dev = true

routes = [
  { pattern = "alfredmayaki.me/chat*", zone_name = "alfredmayaki.me" },
  { pattern = "www.alfredmayaki.me/chat*", zone_name = "alfredmayaki.me" }
]

[vars]
AI_MODEL = "claude-opus-4-5-20251101"
AI_PROVIDER = "anthropic"

# AI model bindings for Workers AI — add one binding per model you intend to call via env.AI.run(...)
# The binding name must match the variable name you use in the worker (env.AI)
[[ai_models]]
binding = "AI"
model = "@cf/deepgram/aura-2-en"
# optional: add a note or model-specific settings if required by Cloudflare account configuration