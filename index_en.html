  <script>
    document.getElementById('last-updated').textContent =
      new Date(document.lastModified).toLocaleDateString();

    (function () {
      const owner = 'alfredmayaki';
      const repo = `${owner}.github.io`;
      const repoUrl = `https://github.com/${owner}/${repo}/tree/main`;

      const repoLink = document.getElementById('repo-link');
      if (repoLink) repoLink.href = repoUrl;
    })();

    // Handle profile links dropdown
    const profileLinksSelect = document.getElementById('profileLinks');
    if (profileLinksSelect) {
      profileLinksSelect.addEventListener('change', function() {
        const url = this.value;
        if (url) {
          window.open(url, '_blank', 'noopener,noreferrer');
          // Reset to placeholder
          this.value = '';
        }
      });
    }
  </script>
