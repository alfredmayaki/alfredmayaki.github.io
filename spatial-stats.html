       <!DOCTYPE html>
       <html lang="en">
       <head>
       <meta charset="UTF-8">
       <title>Southwark Unemployment Map</title>
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <!-- Universe background -->
       <style>
         body, html {
           margin: 0;
           padding: 0;
           width: 100%; height: 100%;
           background: url('universe.png') center/cover no-repeat fixed;
           font-family: Arial, sans-serif;
           color: #fff;
         }
         #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
         svg { width: 100%; height: 100%; }
         .area {
           stroke: #fff; stroke-width: 1px;
           cursor: pointer;
           transition: fill 0.3s ease;
         }
         .legend {
           position: absolute; bottom: 10px; left: 10px;
           background: rgba(0,0,0,0.5); padding: 10px;
         }
       </style>
       </head>
       <body>
       <div id="map"></div>
       <div class="legend">
         <div><b>Unemployment Rate</b></div>
         <div><span style="background:#fee5d9;padding:5px;">Low</span></div>
         <div><span style="background:#fb6a4a;padding:5px;">Medium</span></div>
         <div><span style="background:#67000d;padding:5px;color:#fff;">High</span></div>
         <div style="font-size:12px;">(Darker = Higher)</div>
       </div>
       
       <!-- Particles.js script -->
       <script src="particles.js"></script>
       <script>
         particlesJS.load('map', 'particles-config.json', function() {
           console.log('particles loaded');
         });
       </script>
       
       <script>
       // Example unemployment dataset (replace with real figures)
       const data = {
         "Peckham": 11.0,     // highest source: Southwark area profile
         "Faraday": 10.0,     // West Central
         "Dulwich Wood": 6.1, // South Southwark
         "Dulwich Village": 2.6,
         "South Bermondsey": 8.0,
         "North East": 5.8
       };
       
       // Colour scale based on unemployment rate
       function getColor(rate) {
         return rate > 9 ? '#67000d' :
                rate > 7 ? '#fb6a4a' :
                '#fee5d9';
       }
       
       // Placeholder shapes (replace with actual GeoJSON conversion to SVG)
       const areas = [
         {name:"Peckham", path:"M150,50 L250,50 L250,150 L150,150 Z"},
         {name:"Faraday", path:"M100,150 L200,150 L200,250 L100,250 Z"},
         {name:"Dulwich Wood", path:"M260,150 L360,150 L360,250 L260,250 Z"},
         {name:"Dulwich Village", path:"M100,260 L200,260 L200,360 L100,360 Z"},
         {name:"South Bermondsey", path:"M260,260 L360,260 L360,360 L260,360 Z"},
         {name:"North East", path:"M150,370 L250,370 L250,470 L150,470 Z"}
       ];
       
       const svgNS = "http://www.w3.org/2000/svg";
       const svg = document.createElementNS(svgNS, "svg");
       
       areas.forEach(a => {
         const rate = data[a.name] || 0;
         const areaShape = document.createElementNS(svgNS, "path");
         areaShape.setAttribute("d", a.path);
         areaShape.classList.add("area");
         areaShape.style.fill = getColor(rate);
         areaShape.addEventListener("click", () => {
           let url;
           switch(a.name) {
             case "Peckham":
               url = "https://services.southwark.gov.uk/assets/attach/250837/2023-Multi-Ward-Area-Profiles-East-Central-Feb24-.pdf";
               break;
             case "Faraday":
               url = "https://www.southwark.gov.uk/sites/default/files/2025-02/2023_multi-ward_area_profiles_-_west_central_feb_24.pdf";
               break;
             case "Dulwich Wood":
             case "Dulwich Village":
               url = "https://www.southwark.gov.uk/sites/default/files/2025-02/2023_multi-ward_area_profiles_-_south_feb_24.pdf";
               break;
             case "South Bermondsey":
             case "North East":
               url = "https://services.southwark.gov.uk/assets/attach/250836/2023-Multi-Ward-Area-Profiles-North-East-Feb24-.pdf";
               break;
             default:
               url = "https://www.ons.gov.uk/";
           }
           window.open(url, "_blank");
         });
         svg.appendChild(areaShape);
       });
       
       document.getElementById("map").appendChild(svg);
       </script>
       </body>
       </html>
</html>
